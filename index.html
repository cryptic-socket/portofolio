<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jema | IT Projects</title>
  <meta name="description" content="Portfolio of IT and software projects by Jema.">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <a class="skip-link" href="#projects">Skip to projects</a>

  <header class="site-header">
    <img class="avatar" src="avatar.png" alt="Portrait of Jema" width="120" height="120">
    <h1 class="name">Jema</h1>
    <p class="role">Computer Science / IT</p>
    <p class="bio">
      Building applications, experimenting with code, and exploring dark retro horror aesthetics.
      Select a project panel below to inspect details and source code.
    </p>

    <nav class="socials" aria-label="Social links">
      <a href="https://github.com/cryptic-socket" rel="noopener" target="_blank">GitHub</a>
    </nav>
  </header>

  <main>
    <section id="projects" class="projects" aria-labelledby="projects-title">
      <h2 id="projects-title" class="section-title">Projects</h2>

      <div id="project-list" class="project-list" aria-live="polite">
        <p class="status">Loading projects…</p>
      </div>

      <noscript>
        <p class="status">Enable JavaScript to view the project list.</p>
      </noscript>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year">2026</span> Jema</p>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
